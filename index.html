
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Text Generator</h1>
    <p>กรอกข้อมูลเพื่อสร้างข้อความ</p>

    <form id="generatorForm">
      <label>Domain name</label>
      <input name="domain" required>

      <label>Direct Admin URL</label>
      <input name="host_ip" required>

      <label>Host Username</label>
      <input name="host_user" required>

      <label>Host Password</label>
      <input name="host_password" required>

      <hr>

      <label>WP Username</label>
      <input name="wp_user" required>

      <label>WP Password</label>
      <input name="wp_password" required>

      <label>Email Reset</label>
      <input name="wp_email" type="email" required>



      <button type="submit">สร้างข้อความ</button>
    </form>

    <section class="output">
      <h3>ข้อความที่สร้างได้</h3>
      <textarea id="host_result" rows="12" readonly></textarea>
      <textarea id="wp_result" rows="12" readonly></textarea>
      <textarea id="divi_result" rows="4" readonly></textarea>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
